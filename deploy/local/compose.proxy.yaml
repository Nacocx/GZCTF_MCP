# Use with -p gzctf-mcp-proxy and the base compose.yaml: separate DB/files and loopback port.
services:
  gzctf:
    ports: !override
      - '127.0.0.1:18081:8080'
    environment:
      GZCTF_ContainerProvider__PortMappingType: PlatformProxy
      GZCTF_ContainerProvider__DockerConfig__ChallengeNetwork: gzctf-mcp-proxy-challenges
